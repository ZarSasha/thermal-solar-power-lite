[mod-setting-name]
  tspl-exchanger-enable-color=Basic heat exchanger color option
  tspl-panel-heat-generation-kW=Thermal solar panel heat energy output (kW)
  tspl-exchanger-capacity-kW=Basic heat exchanger steam energy output (kW)
  tspl-exchanger-temperature-target=Basic heat exchanger steam temperature (°C)
  tspl-choose-mod-adaptation=Choose mod compatibility

[mod-setting-description]
  tspl-exchanger-enable-color=Gives a nice, [font=default-semibold][color=yellow]yellow paintjob[/color][/font] to the basic heat exchanger. Helps differentiate it from the heat exchanger.
  tspl-panel-heat-generation-kW=The maximum amount of heat energy that the thermal solar panel will generate during the day (range: 0-250kW).\nThe net output is significantly lower at the target temperature of the basic heat exchanger, due to heat loss!
  tspl-exchanger-capacity-kW=The maximum amount of energy converted within the basic heat exchanger. The default of 2,100kW equals 70/s of 165°C steam (range: 1-10,000kW).
  tspl-exchanger-temperature-target=The target temperature for production of steam in the basic heat exchanger (range: 100-500°C).
  tspl-choose-mod-adaptation=This setting enables adaptations to various mods (only 1 right now in 2.0!). I recommend changing the energy parameters to something suitable as well.

[string-mod-setting]
  tspl-choose-mod-adaptation-Pyanodon=Pyanodon [img=info]

[string-mod-setting-description]
  tspl-choose-mod-adaptation-Pyanodon=Lowers heat loss rate for the thermal solar panel to allow similarly efficient production of steam at 250°C.\nSuggested values: Exchanger 4,250kW/250°C.

[factoriopedia-description]
  tspl-thermal-solar-panel=Produces heat from sunlight, slowly cooling down at night. Once the temperature reaches a certain threshold, it may drive a heat exchanger to produce steam.
  tspl-thermal-solar-panel-large=Much larger version of the thermal solar panel. Produces heat from sunlight, slowly cooling down at night. Once the temperature reaches a certain threshold, it may drive a heat exchanger to produce steam.
