[mod-setting-description]
  tspl-exchanger-enable-color=Gives a nice, [font=default-semibold][color=yellow]yellow paintjob[/color][/font] to the basic heat exchanger. Helps differentiate it from the heat exchanger.
  tspl-panel-heat-generation-kW=The maximum amount of heat energy that the thermal solar panel will generate during the day (range: 0-250kW).\nThe net output is significantly lower at the target temperature of the basic heat exchanger, due to heat loss!
  tspl-panel-heat-loss-coefficient=A coefficient that determines how fast the heat that is accumulated in the thermal solar panels is dissipated to the surroundings.
  tspl-exchanger-capacity-kW=The maximum amount of energy converted within the basic heat exchanger. The default of 2,100kW equals 70/s of 165°C steam (range: 1-10,000kW).
  tspl-exchanger-temperature-target=The target temperature for production of either hot water or steam in the basic heat exchanger. (range: 15-500°C).

[factoriopedia-description]
  tspl-thermal-solar-panel=Produces heat from sunlight, slowly cooling down at night. Once the temperature reaches a certain threshold, it may drive a heat exchanger to produce hot water or steam.
  tspl-thermal-solar-panel-large=Much larger version of the thermal solar panel. Produces heat from sunlight, slowly cooling down at night. Once the temperature reaches a certain threshold, it may drive a heat exchanger to produce hot water or steam.
