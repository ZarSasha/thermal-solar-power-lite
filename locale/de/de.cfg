[technology-description]
  tspl-thermal-solar-power=Ermöglicht den Bau einen thermischen Solarkomplex, einer erneuerbaren Quelle für Dampf. Besonders nützlich für Dampfkraft.

[mod-setting-name]
  tspl-exchanger-enable-color=Basic Wärmetauscher Farboption
  tspl-panel-heat-generation-kW=Thermische Solarpanel Energieproduktion (kW)
  tspl-panel-heat-loss-coefficient=
  tspl-exchanger-capacity-kW=Basic Wärmetauscher Energieumwandlung (kW)
  tspl-exchanger-temperature-target=Basic Wärmetauscher Dampftemperatur (°C)
  #tspl-choose-mod-adaptation=Wählen Sie Mod-Anpassung #DeepL

[mod-setting-description]
  tspl-exchanger-enable-color=Verleiht dem basic Wärmetauscher eine schöne [font=default-semibold][color=yellow]gelbe Lackierung[/color][/font]. Hilft, dies von Wärmetauscher zu unterscheiden.
  tspl-panel-heat-generation-kW=Die maximale Menge an Wärmeenergie, die das thermische Solarpanel tagsüber erzeugt (Wertebereich: 0-250kW).\nDie Nettoleistung ist aufgrund von Wärmeverlusten bei der Zieltemperatur des basic Wärmetauscher deutlich geringer!
  tspl-panel-heat-loss-coefficient=
  tspl-exchanger-capacity-kW=Die maximale Energiemenge, die im basic Wärmetauscher umgewandelt wird. Die Standardleistung von 2.100kW entspricht 70/s 165°C Dampf (Wertebereich: 0-10.000kW).
  tspl-exchanger-temperature-target=Die Zieltemperatur für die Dampferzeugung im basic Wärmetauscher (Wertebereich: 100-500°C).
  #tspl-choose-mod-adaptation=Diese Einstellung ermöglicht Anpassungen an verschiedene Mods (derzeit nur 1 in 2.0!). Ich empfehle, auch die Energieparameter auf etwas passend zu ändern.

[string-mod-setting]
  #tspl-choose-mod-adaptation-Pyanodon=Pyanodon [img=info]

[string-mod-setting-description]
  #tspl-choose-mod-adaptation-Pyanodon=Senkt die Wärmeverlustrate der thermischen Solarpanels, um eine ähnlich effiziente Dampferzeugung bei 250 °C zu ermöglichen.\nEmpfohlene Werte: Wärmetauscher 4.250kW/250°C.

[factoriopedia-description]
  tspl-thermal-solar-panel=Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab. Sobald die Temperatur einen bestimmten Schwellenwert erreicht, kann sie einen Wärmetauscher zur Dampferzeugung antreiben.
  tspl-thermal-solar-panel-large=Viel größere Version des thermisches Solarpanel. Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab. Sobald die Temperatur einen bestimmten Schwellenwert erreicht, kann sie einen Wärmetauscher zur Dampferzeugung antreiben.
