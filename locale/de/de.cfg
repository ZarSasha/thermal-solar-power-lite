  tspl-thermal-solar-panel=Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab.
  tspl-thermal-solar-panel-large=Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab. Große Version.
  tspl-basic-heat-exchanger-water=Verwendet Wärmeenergie, um Wasser auf __1__°C zu erwärmen.
  tspl-basic-heat-exchanger-steam=Verwendet Wärmeenergie, um Wasser in Dampf mit einer Temperatur von __1__°C umzuwandeln.
  tspl-basic-heat-pipe=Eine geringerer Version des Wärmerohr.

