  tspl-exchanger-temperature-target=Basic Wärmetauscher Zieltemperatur (°C)

[mod-setting-description]
  tspl-exchanger-enable-color=Verleiht dem basic Wärmetauscher eine schöne [font=default-semibold][color=yellow]gelbe Lackierung[/color][/font]. Hilft, dies von Wärmetauscher zu unterscheiden.
  tspl-panel-heat-generation-kW=Die maximale Menge an Wärmeenergie, die das thermische Solarpanel tagsüber erzeugt (Wertebereich: 0-250kW).\nDie Nettoleistung ist aufgrund von Wärmeverlusten bei der Zieltemperatur des basic Wärmetauscher deutlich geringer!
  tspl-panel-heat-loss-coefficient=Ein Koeffizient, der bestimmt, wie schnell die in den thermischen Solarpanels gespeicherte Wärme an die Umgebung abgegeben wird.
  tspl-exchanger-capacity-kW=Die maximale Energiemenge, die im basic Wärmetauscher umgewandelt wird. Die Standardleistung von 2.100kW entspricht 70/s 165°C Dampf (Wertebereich: 1-10.000kW).
  tspl-exchanger-temperature-target=Die Zieltemperatur für die Erzeugung von Warmwasser oder Dampf im basic Wärmetauscher (Wertebereich: 15-500°C).

[factoriopedia-description]
  tspl-thermal-solar-panel=Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab. Sobald die Temperatur einen bestimmten Schwellenwert erreicht, kann sie einen Wärmetauscher zur Erzeugung von Warmwasser oder Dampf antreiben.
  tspl-thermal-solar-panel-large=Viel größere Version des thermisches Solarpanel. Erzeugt Wärme aus Sonnenlicht und kühlt nachts langsam ab. Sobald die Temperatur einen bestimmten Schwellenwert erreicht, kann sie einen Wärmetauscher zur Erzeugung von Warmwasser oder Dampf antreiben.
