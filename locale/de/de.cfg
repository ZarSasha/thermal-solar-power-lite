[mod-setting-name]
  tspl-exchanger-enable-color=Basic Wärmetauscher Farboption
  tspl-panel-heat-generation-kW=Thermische Solarpanel Wärmeerzeugung (kW)
  tspl-panel-heat-loss-coefficient=Thermische Solarpanel Wärmeverlustkoeffizient
